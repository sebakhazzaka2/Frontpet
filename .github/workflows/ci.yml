name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Maven + Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Los @SpringBootTest levantan un Postgres 16 efímero vía Testcontainers
      # (ver AbstractIntegrationTest), así que el runner solo necesita Docker —
      # que ubuntu-latest ya trae. Sin sidecar `services:` y sin DB_* env vars.
      - name: mvn verify
        working-directory: backend
        run: mvn -B verify

  frontend:
    name: Frontend (pnpm build + test + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Read Node version from .nvmrc
        id: node_version
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node_version.outputs.version }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # --frozen-lockfile: falla si el lockfile no matchea package.json,
      # en vez de reescribirlo en silencio (mismo espíritu que ADR 015).
      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: pnpm build
        run: pnpm build

      - name: pnpm test
        run: pnpm test

      - name: pnpm lint
        run: pnpm lint
