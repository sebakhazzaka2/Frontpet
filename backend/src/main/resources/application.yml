spring:
  application:
    name: frontpet-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/frontpet}
    username: ${DB_USERNAME:frontpet}
    password: ${DB_PASSWORD:frontpet_dev_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    web:
      pageable:
        default-page-size: 24
        # Tope duro: sin esto, ?size=100000 es una forma gratis de tirar el server.
        max-page-size: 100

frontpet:
  cors:
    # Orígenes del frontend. En prod se sobreescribe por env var con el dominio real.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

  cookie:
    # Domain de la cookie de sesión (ADR 004). Vacío en dev a propósito: front
    # y back comparten host (`localhost`, distinto puerto — las cookies se
    # scopean por host, no por puerto) así que no hace falta. En producción,
    # front y back viven en subdominios reales (frontpet.com.br/
    # api.frontpet.com.br) — sin este Domain, la cookie que setea el backend
    # queda host-only para api.frontpet.com.br y el guard del admin
    # (frontend, ProtectedAdminLayout) nunca la ve. Verificado 2026-09-02
    # contra un deploy real: el login backend daba "sucesso" en el log pero
    # el admin rebotaba a /login en loop.
    domain: ${COOKIE_DOMAIN:}

  app:
    # URL pública del frontend, usada para armar el link de redefinição de
    # senha (tarea 7.12) — nunca hardcodear un dominio en el código.
    # StartupEnvValidator exige que empiece con https:// en producción: un
    # link de reset por http manda el token en claro por la red.
    base-url: ${APP_BASE_URL:http://localhost:3000}

  tenant:
    # MVP1 es single-tenant: el tenant sembrado en V5__seed_dev.sql.
    # Los endpoints públicos no tienen JWT del cual sacarlo. Ver CurrentTenant.
    id: ${TENANT_ID:01924ccf-0000-7000-8000-000000000001}

  admin:
    # Seed idempotente del admin único (config/DataInitializer). En prod,
    # StartupEnvValidator exige que ADMIN_PASSWORD no quede en el default de dev.
    email: ${ADMIN_EMAIL:admin@frontpet.dev}
    password: ${ADMIN_PASSWORD:admin123}

  resend:
    # Cliente HTTP a mano contra la API de Resend (notifications.ResendEmailSender,
    # tarea 7.12) — sin API key, NotificationsConfig cae a LoggingEmailSender
    # (dev/test escriben el email en el log en vez de mandarlo de verdad).
    api-key: ${RESEND_API_KEY:}
    from: ${RESEND_FROM:FrontPet <nao-responda@frontpet.com.br>}

  r2:
    # Cuenta + bucket creados 2026-07-25 (ver ROADMAP tarea 3.5). Credenciales
    # reales solo existen como env vars, nunca en este archivo.
    account-id: ${R2_ACCOUNT_ID:}
    access-key-id: ${R2_ACCESS_KEY_ID:}
    secret-access-key: ${R2_SECRET_ACCESS_KEY:}
    bucket-name: ${R2_BUCKET_NAME:frontpet-products}
    endpoint: ${R2_ENDPOINT:}
    # Dominio público de lectura (r2.dev habilitado en el bucket, o el
    # dominio custom cuando llegue Sprint Despliegue). Vacío en dev hasta
    # que se habilite — sin esto no se puede armar mainImageUrl después del
    # upload, pero el presign en sí no lo necesita para firmar el PUT.
    public-url: ${R2_PUBLIC_URL:}

  login-rate-limit:
    # Rate limit del login por IP (tarea 1.8, ADR 019). Escape hatch: false
    # desactiva el bloqueo sin tocar código, para rescatar a alguien con un
    # redeploy si hace falta.
    enabled: ${LOGIN_RATE_LIMIT_ENABLED:true}
    max-failures: 10
    window: 15m

  password-reset:
    # Reset de contraseña del admin (tarea 7.12, ADR 022).
    ttl: 60m
    ip-rate-limit:
      # Cubre POST /forgot-password Y /reset-password — protege el server y
      # el brute-force del token en sí.
      enabled: ${PASSWORD_RESET_RATE_LIMIT_ENABLED:true}
      max-attempts: 5
      window: 15m
    email-rate-limit:
      # Solo POST /forgot-password (el filtro no puede leer el body — ver
      # PasswordResetEmailAttemptService). Protege la casilla del cliente
      # del bombardeo desde IPs rotativas, no el servidor.
      enabled: ${PASSWORD_RESET_RATE_LIMIT_ENABLED:true}
      max-attempts: 3
      window: 1h

  order-rate-limit:
    # Rate limit de POST /api/v1/orders por IP (tarea 4.15). A diferencia del
    # login, cuenta TODAS las requests (no solo las fallidas) — ver
    # OrderRateLimitService.
    enabled: ${ORDER_RATE_LIMIT_ENABLED:true}
    max-requests: 5
    window: 10m

  appointment-rate-limit:
    # Rate limit de POST /api/v1/appointments por IP (tarea 5.8). Misma
    # mecánica que order-rate-limit — ver AppointmentRateLimitService.
    enabled: ${APPOINTMENT_RATE_LIMIT_ENABLED:true}
    max-requests: 5
    window: 10m

jwt:
  secret: ${JWT_SECRET:dev-only-secret-nao-usar-em-producao-32chars}
  expiration: ${JWT_EXPIRATION:3600000}

server:
  port: 8080
  # FRAMEWORK registra el ForwardedHeaderFilter de Spring, que reescribe
  # getRemoteAddr() desde X-Forwarded-* y descarta esos headers.
  #
  # ⚠️ Default NONE a propósito. Solo poner FRAMEWORK cuando Caddy sea el
  # ÚNICO camino de entrada y esté configurado con `trusted_proxies` (rangos
  # de Cloudflare). Si la app es alcanzable directo y esto está en FRAMEWORK,
  # cualquiera se saltea el rate limit del login con un header falso. Ver
  # ADR 019 y el checklist del Sprint Despliegue.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:NONE}

sentry:
  # Sin DSN (dev/test), el starter se auto-desactiva solo — no hace falta
  # el patrón de placeholder de R2Config/NotificationsConfig acá.
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:development}
  # Sin performance tracing (APM): esto es solo captura de errores (D.8).
  # traces-sample-rate por defecto es 0 — no hace falta ponerlo explícito.

management:
  endpoints:
    web:
      exposure:
        # Solo health. Ni info ni metrics: no hay Prometheus en MVP1, y lo que
        # no está expuesto no puede filtrar nada.
        include: health
  endpoint:
    health:
      # /actuator/health es permitAll, así que su cuerpo es público. Con
      # `never` devuelve {"status":"UP"} y nada más — pero el chequeo de la DB
      # SIGUE corriendo y sigue determinando ese UP/DOWN. Se oculta el
      # detalle, no el chequeo.
      show-details: never
      probes:
        enabled: true # habilita /actuator/health/liveness y /readiness para Coolify

logging:
  level:
    root: INFO
    com.frontpet: DEBUG

---
# ── Perfil prod ────────────────────────────────────────────────────────────
# Logging JSON estructurado SOLO en prod: leer JSON a mano en la terminal
# local es insufrible y no aporta nada sin un agregador detrás.
spring:
  config:
    activate:
      on-profile: prod

sentry:
  environment: production

logging:
  level:
    com.frontpet: INFO # DEBUG en prod llena disco y filtra información
  structured:
    format:
      console: ecs # Formatter nativo de Boot 3.4+. Sin dependencias extra.
    ecs:
      service:
        name: frontpet-backend
        environment: production
