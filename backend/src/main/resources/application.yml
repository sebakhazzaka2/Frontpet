spring:
  application:
    name: frontpet-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/frontpet}
    username: ${DB_USERNAME:frontpet}
    password: ${DB_PASSWORD:frontpet_dev_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    web:
      pageable:
        default-page-size: 24
        # Tope duro: sin esto, ?size=100000 es una forma gratis de tirar el server.
        max-page-size: 100

frontpet:
  cors:
    # Orígenes del frontend. En prod se sobreescribe por env var con el dominio real.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

  tenant:
    # MVP1 es single-tenant: el tenant sembrado en V5__seed_dev.sql.
    # Los endpoints públicos no tienen JWT del cual sacarlo. Ver CurrentTenant.
    id: ${TENANT_ID:01924ccf-0000-7000-8000-000000000001}

  admin:
    # Seed idempotente del admin único (config/DataInitializer). En prod,
    # StartupEnvValidator exige que ADMIN_PASSWORD no quede en el default de dev.
    email: ${ADMIN_EMAIL:admin@frontpet.dev}
    password: ${ADMIN_PASSWORD:admin123}

  r2:
    # Cuenta + bucket creados 2026-07-25 (ver ROADMAP tarea 3.5). Credenciales
    # reales solo existen como env vars, nunca en este archivo.
    account-id: ${R2_ACCOUNT_ID:}
    access-key-id: ${R2_ACCESS_KEY_ID:}
    secret-access-key: ${R2_SECRET_ACCESS_KEY:}
    bucket-name: ${R2_BUCKET_NAME:frontpet-products}
    endpoint: ${R2_ENDPOINT:}
    # Dominio público de lectura (r2.dev habilitado en el bucket, o el
    # dominio custom cuando llegue Sprint Despliegue). Vacío en dev hasta
    # que se habilite — sin esto no se puede armar mainImageUrl después del
    # upload, pero el presign en sí no lo necesita para firmar el PUT.
    public-url: ${R2_PUBLIC_URL:}

jwt:
  secret: ${JWT_SECRET:dev-only-secret-nao-usar-em-producao-32chars}
  expiration: ${JWT_EXPIRATION:3600000}

server:
  port: 8080

logging:
  level:
    root: INFO
    com.frontpet: DEBUG
